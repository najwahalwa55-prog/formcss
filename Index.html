<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-B">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <style>
  .login-container {
      width: 300px;
      margin: 100px auto;
      padding: 20px 40px;
      background-color: #bb9aea93;
      border-radius: 50px;
      box-shadow: 0 0 10px rgba(227, 9, 9, 0.1);
      font-family:Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif
    }
 input[type="text"] {
   width: 100%;
   padding: 10px;
   margin-bottom: 20px;
   border: 3px solid #ccc;
   border-radius: 4px;
   box-sizing: border-box;
 }
input[type="password"] {
   width: 100%;
   padding: 10px;
   margin-bottom: 20px;
   border: 3px solid #ccc;
   border-radius: 4px;
   box-sizing: border-box;
 }
input[type="checkbox"] {
  margin-right: 5px;
  margin-bottom: 15px;
}
button[type="submit"] {
  width: 100%;
  pading: 10px;
  background-color: #303737;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}
  button[type="submit"]:hover {
    background-color: #719fd0;
  }
  p {
    text-align: center;
  }

  a {
    color: #522430ec;
  }

  a:hover {
    text-decorati9n: underline;
  }
  @media (max-width: 600px) {
    .login-continer{
      width: 90%;
      margin: 50px auto;
    }
    input[type="text"], input[type="password"], button[type="submit"] {
      font-size: 16px
    }
  }
    </style>
  <body>
    <div class="login-container">
      <h2>Please Login in Herel</h2>
      <form action="0" method="POST">
        <label for="username">Username</label>
        <input type="text" id="password" : name="username" placeholder="Username" required>

        <label for="password">Password</label>
        <input type="password" id="password" : name="password" placeholder="password" required>
        <label>
          <input type="checkbox" name="remember"> Remember me
        </label>
        <button type="submit">Login</button>
        <p><a href="0">Forgot Password ?</a></p>
        <p>Not a member?<a href="0">Signup now</a></p>
      </form>
    </div>
  </body>
  </html>
